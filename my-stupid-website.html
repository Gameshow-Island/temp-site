<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My WIX-ISH Masterpiece</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #111318;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .page-canvas {
      position: relative;
      width: 980px;
      max-width: 100%;
      height: 1150px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      overflow-x: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    @keyframes wixish-marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .wixish-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: wixish-marquee 10s linear infinite;
    }
  </style>
</head>
<body>
  <main class="page-canvas">
    <h1 style="position: absolute; left: 210px; top: 12px; width: 480px; height: 210px; z-index: 1; transform: rotate(0deg); background-color: transparent; border-radius: 0px; border: none; box-sizing: border-box; overflow: hidden; font-family: 'Inter', sans-serif; font-size: 36px; color: #111827; font-weight: 700; font-style: normal; text-align: center; margin: 0; padding: 8px 10px; display: flex; align-items: center; justify-content: center; line-height: 1.2;">THIS WEBSITE HAS NOTHING RIGHT NOW</h1>
    <a href="#" onclick="event.preventDefault(); alert('Congrats! You clicked a button on a stupid website!');" style="position: absolute; left: 120px; top: 420px; width: 190px; height: 52px; z-index: 2; transform: rotate(0deg); background-color: #116dff; border-radius: 12px; border: none; box-shadow: 6px 6px 0px rgba(0,0,0,0.85); box-sizing: border-box; overflow: hidden; font-family: 'Inter', sans-serif; font-size: 16px; color: #ffffff; font-weight: 700; font-style: normal; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 0 14px; cursor: pointer;">useless button</a>
  </main>
</body>
</html>
